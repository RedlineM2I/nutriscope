[project]
name = "nutriscope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cauchma", email = "301998336+cauchma@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.5",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "phoenix>=0.9.1",
    "psutil==7.2.2",
    "psycopg2-binary==2.9.12",
    "pyarrow==25.0.1",
    "pytest==9.1.1",
    "python-dotenv==1.2.3",
    "scipy==1.18.1",
    "sqlalchemy==2.0.52",
    "tqdm==4.70.0",
]

[project.scripts]
nutriscope = "nutriscope:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
